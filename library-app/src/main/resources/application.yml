server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: library-management

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/library_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Password123}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # schema is owned by Flyway
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Phnom_Penh

  data:
    web:
      pageable:
        max-page-size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/library/protocol/openid-connect/certs}

library:
  keycloak:
    token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/library/protocol/openid-connect/token}
    client-id: ${KEYCLOAK_CLIENT_ID:library-api}
  scheduler:
    overdue-cron: "0 0 1 * * *"   # every day at 01:00
  penalty:
    per-book-per-day: 1.00

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
